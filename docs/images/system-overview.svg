<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <style>
      .title { font: 700 32px 'Segoe UI', Tahoma, sans-serif; fill: #10243f; }
      .label { font: 600 18px 'Segoe UI', Tahoma, sans-serif; fill: #10243f; }
      .small { font: 500 15px 'Segoe UI', Tahoma, sans-serif; fill: #29486b; }
      .box { fill: #eef6ff; stroke: #3268a8; stroke-width: 2; rx: 16; }
      .accent { fill: #f5fbff; stroke: #0b7a75; stroke-width: 2; rx: 16; }
      .line { stroke: #1c6ea4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1c6ea4" />
    </marker>
  </defs>

  <rect width="1100" height="520" fill="#ffffff" />
  <text x="40" y="56" class="title">SmartRace BT Control - Systemuebersicht</text>

  <rect x="40" y="110" width="260" height="290" class="box" />
  <text x="65" y="150" class="label">6 physische Tasten</text>
  <text x="65" y="182" class="small">GPIO 14, 27, 26, 25, 33, 32</text>
  <text x="65" y="212" class="small">INPUT_PULLUP (aktiv LOW)</text>
  <text x="65" y="242" class="small">Entprellung + Kurz/Langdruck</text>

  <rect x="420" y="90" width="280" height="330" class="accent" />
  <text x="448" y="134" class="label">ESP32 Firmware</text>
  <text x="448" y="168" class="small">SmartRace BT Control</text>
  <text x="448" y="206" class="small">- Button-Handler</text>
  <text x="448" y="234" class="small">- BLE Keyboard</text>
  <text x="448" y="262" class="small">- Web UI (192.168.4.1)</text>
  <text x="448" y="290" class="small">- Config in NVS</text>
  <text x="448" y="318" class="small">- Bond-Reset + Neustart</text>

  <rect x="820" y="110" width="240" height="120" class="box" />
  <text x="846" y="152" class="label">Bluetooth Host</text>
  <text x="846" y="182" class="small">iPhone / iPad / PC</text>
  <text x="846" y="210" class="small">empfaengt Tastencodes</text>

  <rect x="820" y="280" width="240" height="120" class="box" />
  <text x="846" y="322" class="label">Web-Browser</text>
  <text x="846" y="352" class="small">verbunden mit AP</text>
  <text x="846" y="380" class="small">setzt Konfiguration</text>

  <path d="M300 250 L420 250" class="line" />
  <path d="M700 165 L820 165" class="line" />
  <path d="M700 340 L820 340" class="line" />

  <text x="312" y="236" class="small">Button-Ereignisse</text>
  <text x="714" y="148" class="small">BLE Tastatur</text>
  <text x="714" y="323" class="small">HTTP POST/GET</text>
</svg>
